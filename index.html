<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kremó — Menú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,500&family=Work+Sans:wght@300;400;500;600&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #ebe3d9;
    --dark: #4e4b4c;
    --bg: #2a2726;
    --card-border: #4a4441;
    --olive: #a99e80;
    --olive-deep: #7a7055;
    --gold: #dbbc6a;
    --wine: #8a4646;
    --wine-deep: #673333;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--cream);
    font-family:'Work Sans', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,.serif{
    font-family:'Bodoni Moda', serif;
    font-weight:500;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    padding: 3.5rem 1.5rem 2.5rem;
    text-align:center;
    overflow:hidden;
    background:
      radial-gradient(ellipse 65% 55% at 15% -5%, rgba(219,188,106,0.10), transparent 60%),
      radial-gradient(ellipse 55% 45% at 90% 5%, rgba(103,51,51,0.22), transparent 60%),
      var(--bg);
    border-bottom: 1px solid var(--card-border);
  }
  .hero img.logo{
    width: min(78vw, 380px);
    height: auto;
    margin: 0 auto;
    display: block;
    position: relative;
    z-index: 2;
  }
  .hero p.tagline{
    max-width: 36ch;
    margin: 1.2rem auto 0;
    color: var(--olive);
    font-size: 1.02rem;
    font-family:'Work Sans', sans-serif;
    position: relative;
    z-index: 2;
  }
  .divider{
    width: 44px;
    height: 2px;
    background: var(--gold);
    margin: 1.6rem auto 0;
    border: none;
    position: relative;
    z-index: 2;
  }

  /* ---------- Nav de categorías ---------- */
  .cat-nav{
    position: sticky;
    top: 0;
    z-index: 30;
    display:flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding: 0.9rem 1.2rem;
    background: rgba(42,39,38,0.94);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--card-border);
    scrollbar-width: none;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-btn{
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--olive);
    padding: 0.5rem 1.05rem;
    border-radius: 999px;
    font-family:'Oswald', sans-serif;
    font-size: 0.88rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .cat-btn:hover{ color: var(--cream); border-color: var(--gold); }
  .cat-btn.active{
    background: var(--wine-deep);
    border-color: var(--wine-deep);
    color: var(--cream);
  }

  /* ---------- Secciones ---------- */
  main{ max-width: 820px; margin: 0 auto; padding: 2.5rem 1.4rem 3rem; }
  .section{ display:none; animation: fade 0.35s ease; }
  .section.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform: translateY(6px);} to{opacity:1; transform:none;} }

  .section-head{
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 1.4rem;
    justify-content: space-between;
  }
  .section-head .text h2{ font-size: 1.85rem; margin: 0 0 0.35rem; color: var(--cream); font-style: italic; }
  .section-head .text .desc{ color: var(--olive); font-size: 0.94rem; margin:0; max-width: 42ch; }
  .section-head .blob-wrap{ flex-shrink: 0; }

  /* ---------- Blobs orgánicos ---------- */
  .blob{
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(.2,.8,.2,1), border-radius 0.4s ease;
    box-shadow: 0 10px 28px rgba(0,0,0,0.4);
  }
  .blob img{ width:100%; height:100%; object-fit: cover; display:block; filter: saturate(0.94) contrast(1.03) brightness(0.97); }
  .blob::after{
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(155deg, rgba(103,51,51,0.16), rgba(219,188,106,0.10) 60%, transparent);
    mix-blend-mode: multiply;
    pointer-events:none;
  }
  .blob:hover, .blob:active{ transform: scale(1.05) rotate(0deg) !important; }

  .blob-hero{ width: 128px; height: 158px; border-radius: 58% 42% 63% 37% / 55% 40% 60% 45%; transform: rotate(-3deg); }
  .blob-1{ width: 108px; height: 128px; border-radius: 63% 37% 54% 46% / 55% 45% 55% 45%; transform: rotate(-4deg); }
  .blob-2{ width: 108px; height: 128px; border-radius: 42% 58% 68% 32% / 45% 41% 59% 55%; transform: rotate(3deg); }
  .blob-3{ width: 108px; height: 128px; border-radius: 50% 50% 33% 67% / 61% 41% 59% 39%; transform: rotate(-2deg); }
  .blob-4{ width: 108px; height: 128px; border-radius: 36% 64% 60% 40% / 45% 51% 49% 55%; transform: rotate(4deg); }

  .item{
    border-bottom: 1px solid var(--card-border);
    padding: 1.3rem 0;
    display:flex;
    align-items: center;
    gap: 1.2rem;
  }
  .item:last-child{ border-bottom: none; }
  .item-info{ flex: 1; min-width:0; }
  .item-body{ display:flex; justify-content: space-between; align-items: flex-start; gap: 1.2rem; }
  .item-name{
    font-family:'Bodoni Moda', serif;
    font-size: 1.18rem;
    color: var(--cream);
    display:flex;
    align-items:baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .badge{
    font-family:'Oswald', sans-serif;
    font-size: 0.68rem;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    letter-spacing: 0.03em;
  }
  .badge.temporada{ background: rgba(219,164,65,0.14); color: var(--gold); border: 1px solid rgba(219,188,106,0.4); }
  .badge.agotado{ background: rgba(154,143,111,0.12); color: var(--olive); border: 1px solid var(--card-border); }
  .badge.dias{ background: rgba(138,70,70,0.22); color: #d9a9a9; border: 1px solid rgba(138,70,70,0.5); }
  .item-desc{ color: var(--olive); font-size: 0.9rem; margin-top: 0.35rem; max-width: 40ch; }
  .item-portion{ color: var(--olive-deep); font-size: 0.8rem; margin-top: 0.35rem; font-family:'Oswald', sans-serif; letter-spacing:0.01em; }
  .item-prices{
    display:flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.3rem;
    flex-shrink:0;
    min-width: 100px;
  }
  .price-row{ font-size: 0.95rem; color: var(--cream); text-align:right; white-space: nowrap; }
  .price-row .label{ color: var(--olive); font-size: 0.74rem; display:block; font-family:'Oswald', sans-serif; }
  .price-row .amount{ font-family:'Bodoni Moda', serif; font-weight:500; font-size: 1.08rem; }
  .item.unavailable .item-name, .item.unavailable .price-row .amount{ opacity: 0.4; }

  footer{
    max-width: 780px;
    margin: 0 auto;
    padding: 2rem 1.4rem 3rem;
    color: var(--olive);
    font-size: 0.88rem;
    text-align:center;
    border-top: 1px solid var(--card-border);
  }
  footer strong{ color: var(--cream); font-weight: 500; }
  footer img.rocket{
    width: 90px;
    height: auto;
    margin: 0 auto 1.2rem;
    display: block;
    opacity: 0.92;
  }

  /* ---------- Lightbox ---------- */
  .lightbox{
    position: fixed; inset: 0;
    background: rgba(20,17,16,0.86);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 2rem 1.4rem;
    z-index: 100;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .lightbox.active{ opacity: 1; pointer-events: auto; }
  .lightbox-card{
    max-width: 360px;
    width: 100%;
    text-align: center;
    transform: translateY(12px);
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
  }
  .lightbox.active .lightbox-card{ transform: translateY(0); }
  .lightbox-photo{
    width: 240px; height: 290px;
    margin: 0 auto 1.3rem;
    border-radius: 46% 54% 61% 39% / 55% 45% 55% 45%;
    overflow: hidden;
    box-shadow: 0 18px 44px rgba(0,0,0,0.5);
  }
  .lightbox-photo img{ width:100%; height:100%; object-fit: cover; }
  .lightbox-card h3{ font-size: 1.5rem; font-style: italic; margin: 0 0 0.5rem; color: var(--cream); }
  .lightbox-card p{ color: var(--olive); font-size: 0.94rem; margin: 0; }
  .lightbox-close{
    margin-top: 1.4rem;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--olive);
    padding: 0.45rem 1.2rem;
    border-radius: 999px;
    font-family:'Oswald', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .lightbox-close:hover{ color: var(--cream); border-color: var(--gold); }

  @media (max-width: 480px){
    .item{ flex-wrap: wrap; }
    .item-body{ flex-direction: column; gap: 0.5rem; width: 100%; }
    .item-prices{ flex-direction: row; align-items:center; gap: 1.2rem; }
    .price-row{ text-align:left; }
    .blob-1, .blob-2, .blob-3, .blob-4{ width: 84px; height: 100px; }
    .section-head{ flex-direction: column; align-items: flex-start; }
    .blob-hero{ width: 96px; height: 118px; align-self: flex-end; }
  }
</style>
</head>

      { name: "Carrot Cake", desc: "Bizcocho de zanahoria especiado, relleno con un delicado centro de dulce de leche y cubierto con suave crema estilo cream cheese.", familiar: 1750, mediano: 910, photo: "carrot" },
      { name: "Red Velvet Cake", desc: "Bizcocho en capas, relleno con crema estilo cream cheese y coronado con frutos rojos frescos y un ligero toque de azúcar glas.", familiar: 1450, mediano: 780, photo: "red_velvet" },
    ]
  },
  {
    id: "panaderia",
    name: "Panadería | Brioche",
    desc: "Pan suave y mantequilloso, elaborado con masa madre.",
    items: [
      { name: "Pan de mesa", desc: "Brioche suave y mantequilloso, en porciones individuales. Perfecto para acompañar la mesa, desayunos o cenas.", note: "Bolsa de 9 piezas", unico: 240 },
      { name: "Pan de hamburguesa", desc: "Brioche suave, ligeramente dulce y con la miga perfecta para hamburguesas y sandwiches.", note: "Bolsa de 6 piezas", unico: 255 },
      { name: "Brioche de molde", desc: "Pan de masa madre, suave, mantequilloso y ligeramente dulce. Ideal para tostadas, french toast o simplemente mantequilla.", note: "1 pieza de 530 g", unico: 250, photo: "brioche_molde" },
    ]
  },
];

const nav = document.getElementById('catNav');
const main = document.getElementById('main');
const blobClasses = ['blob-1', 'blob-2', 'blob-3', 'blob-4'];

function money(n){ return 'L ' + n.toLocaleString('es-HN'); }

function openLightbox(photoKey, title, desc){
  if(!photoKey) return;
  document.getElementById('lightboxImg').src = photos[photoKey];
  document.getElementById('lightboxTitle').textContent = title;
  document.getElementById('lightboxDesc').textContent = desc || '';
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('active');
}
document.getElementById('lightbox').addEventListener('click', (e) => {
  if(e.target.id === 'lightbox') closeLightbox();
});

data.forEach((cat, i) => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn' + (i === 0 ? ' active' : '');
  btn.textContent = cat.name;
  btn.onclick = () => showSection(cat.id);
  nav.appendChild(btn);

  const section = document.createElement('section');
  section.className = 'section' + (i === 0 ? ' active' : '');
  section.id = 'sec-' + cat.id;

  const headerBlob = cat.headerPhoto
    ? `<div class="blob-wrap"><div class="blob blob-hero" onclick="openLightbox('${cat.headerPhoto}','${cat.name.replace(/'/g,"\\'")}','')"><img src="${photos[cat.headerPhoto]}" alt=""></div></div>`
    : '';

  let html = `<div class="section-head">
      <div class="text"><h2>${cat.name}</h2><p class="desc">${cat.desc}</p></div>
      ${headerBlob}
    </div>`;

  cat.items.forEach((item, idx) => {
    const unavailable = item.agotado ? ' unavailable' : '';
    const blobClass = blobClasses[idx % blobClasses.length];
    const photoHtml = item.photo
      ? `<div class="blob ${blobClass}" onclick="openLightbox('${item.photo}','${item.name.replace(/'/g,"\\'")}','${(item.desc||'').replace(/'/g,"\\'")}')"><img src="${photos[item.photo]}" alt="${item.name}"></div>`
      : '';

    html += `<div class="item${unavailable}">
      ${photoHtml}
      <div class="item-info">
        <div class="item-body">
          <div>
            <div class="item-name">${item.name}
              ${item.temporada ? '<span class="badge temporada">De temporada</span>' : ''}
              ${item.agotado ? '<span class="badge agotado">Agotado</span>' : ''}
              ${item.dias ? `<span class="badge dias">${item.dias}</span>` : ''}
            </div>
            ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
            ${item.note ? `<div class="item-portion">${item.note}</div>` : ''}
            ${item.portion ? `<div class="item-portion">${item.portion}</div>` : (cat.portionNote && !item.unico ? `<div class="item-portion">${cat.portionNote}</div>` : '')}
          </div>
          <div class="item-prices">
            ${item.unico !== undefined
              ? `<div class="price-row"><span class="label">Precio</span><span class="amount">${money(item.unico)}</span></div>`
              : `<div class="price-row"><span class="label">${item.familiarLabel || 'Familiar/Grande'}</span><span class="amount">${money(item.familiar)}</span></div>
                 <div class="price-row"><span class="label">${item.medianoLabel || 'Mediano'}</span><span class="amount">${money(item.mediano)}</span></div>`
            }
          </div>
        </div>
      </div>
    </div>`;
  });

  section.innerHTML = html;
  main.appendChild(section);
});

function showSection(id){
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'sec-' + id));
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.textContent === data.find(d => d.id === id).name));
  window.scrollTo({ top: document.querySelector('.cat-nav').offsetTop, behavior: 'smooth' });
}
</script>

</body>
</html>
